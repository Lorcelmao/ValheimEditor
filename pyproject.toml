[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fch-editor"
version = "0.1.0"
description = "Lossless reader/editor for Valheim .fch player saves"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fch = "fch_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fch_editor.catalog" = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
