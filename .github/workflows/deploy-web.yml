name: Deploy web app to GitHub Pages

# The staleness guard this whole workflow exists for: the wheel served to
# browsers is built here, fresh, on every push -- never committed (see
# .gitignore) -- so a stale packaged artifact (the exact failure the desktop
# .exe hit once, see docs/web-app.md and the project's own history) is
# structurally impossible rather than a thing to remember. A failing test
# blocks the job before any of that ever happens, so a broken build can never
# reach Pages.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the package and dev/build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Run the full test suite
        run: pytest -q

      - name: Build the wheel
        run: |
          rm -rf build src/*.egg-info
          python -m build --wheel --outdir .local-web-dist

      - name: Copy the wheel and write its manifest into web/
        run: |
          rm -f web/*.whl
          wheel=$(ls .local-web-dist/*.whl)
          cp "$wheel" web/
          printf '{"file":"%s"}' "$(basename "$wheel")" > web/wheel.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
